<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Guida Stili BJCP</title>
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#111a16">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lista di schede con striscia del colore SRM reale, scheda stile con barre su scala fissa per confrontare gli stili */
:root {
  --bg: #eceeea;
  --surface: #fbfcfa;
  --fg: #16211b;
  --muted: #5c6a62;
  --line: #d3d9d3;
  --accent: #9a5a00;
  --accent-soft: #f4e4c8;
  --trap-bg: #fff1d6;
  --trap-line: #d9a23c;
  --track: #dfe4df;
  --display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101512; --surface: #18201b; --fg: #e8ece8; --muted: #9aa8a0; --line: #2a352e;
    --accent: #f0aa3c; --accent-soft: #3a2d14; --trap-bg: #2e2412; --trap-line: #8a6420; --track: #27322b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101512; --surface: #18201b; --fg: #e8ece8; --muted: #9aa8a0; --line: #2a352e;
  --accent: #f0aa3c; --accent-soft: #3a2d14; --trap-bg: #2e2412; --trap-line: #8a6420; --track: #27322b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
.masthead h1 { font-family: var(--display); font-size: clamp(2rem, 8vw, 2.75rem); line-height: 1.05; letter-spacing: -0.01em; }
.masthead h1 em { color: var(--muted); font-style: italic; }
.progress { margin-top: 14px; display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.progress .bar { flex: 1; height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--accent); }

.search { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
.search input[type="search"] {
  width: 100%; font: inherit; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px;
}
.search label { font-size: 0.9rem; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.search input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.cat { margin-top: 0; border-bottom: 1px solid rgba(128,128,128,.25); padding: 14px 0; }
.cat summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.cat summary::-webkit-details-marker { display: none; }
.cat summary h2 { margin: 0; }
.cat summary em { font-family: var(--mono); font-style: normal; font-size: 0.78rem; color: var(--muted); }
.cat[open] .list { margin-top: 14px; }
.cat h2 { font-family: var(--display); font-size: 1.55rem; line-height: 1.15; }
.cat h2 span { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); margin-right: 8px; }
.cat p { margin: 6px 0 0; color: var(--muted); font-size: 0.92rem; max-width: 62ch; }
.list { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.card {
  display: grid; grid-template-columns: 10px 1fr; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  text-decoration: none; color: inherit;
}
.card:hover { border-color: var(--accent); }
.swatch { background: var(--sw); }
.card .body { padding: 13px 14px; min-width: 0; }
.card .code { font-family: var(--mono); font-size: 0.8rem; color: var(--accent); }
.card h3 { font-family: var(--display); font-size: 1.45rem; line-height: 1.15; }
.card .nums { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--mono); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
.card .nums b { font-weight: 500; color: var(--muted); margin-right: 5px; }
.empty { margin-top: 28px; color: var(--muted); }
.next { margin-top: 28px; padding: 14px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 0.92rem; }

.back { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); text-decoration: none; font-weight: 500; padding: 6px 0; }
.hero { margin-top: 10px; display: grid; grid-template-columns: 1fr; gap: 14px; }
.hero .code { font-family: var(--mono); color: var(--accent); font-size: 0.9rem; }
.hero h1 { font-family: var(--display); font-size: clamp(2.2rem, 9vw, 3.2rem); line-height: 1.02; }
.hero .catname { color: var(--muted); font-size: 0.92rem; margin-top: 4px; }
.glass {
  height: 44px; border-radius: 10px; border: 1px solid var(--line);
  background: linear-gradient(90deg, var(--c1), var(--c2));
}
.glass-cap { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
.lede { font-size: 1.08rem; max-width: 60ch; margin: 18px 0 0; }
.sec { margin-top: 24px; }
.sec h2 { font-family: var(--mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 500; }
.sec p { margin: 5px 0 0; max-width: 62ch; }
.params { margin-top: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 14px; }
.prow { padding: 11px 0; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-family: var(--mono); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.prow .top b { font-weight: 500; }
.track { position: relative; height: 8px; margin-top: 7px; background: var(--track); border-radius: 4px; }
.track i { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; min-width: 6px; }
.scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 0.68rem; color: var(--muted); margin-top: 3px; }
.trap { margin-top: 24px; background: var(--trap-bg); border: 1px solid var(--trap-line); border-radius: 12px; padding: 14px 16px; }
.trap h2 { font-family: var(--mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500; color: var(--accent); }
.trap p { margin: 6px 0 0; max-width: 62ch; }
.chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.chips span, .chips a.ex { font-size: 0.85rem; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.chips a.ex { color: inherit; text-decoration: none; }
.chips a.ex:hover { border-color: var(--muted); }
.chips.tags span { background: transparent; color: var(--muted); font-size: 0.8rem; }
.foot { margin-top: 36px; font-size: 0.8rem; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
(function () {
  var app = document.getElementById('app');
  var UT={}; fetch('untappd.json').then(function(r){return r.json()}).then(function(m){UT=m||{};}).catch(function(){}); function exHref(n){var p=UT[n]; var w=p?'https://untappd.com'+p:'https://untappd.com/search?q='+encodeURIComponent(n); if(!/Android/i.test(navigator.userAgent)) return w; var path=p?p:'/search?q='+encodeURIComponent(n); return 'intent://untappd.com'+path+'#Intent;scheme=https;package=com.untappdllc.app;S.browser_fallback_url='+encodeURIComponent(w)+';end';}  var DATA = null;

  // Colore della birra: tabella SRM standard, interpolata per i valori con decimali
  var SRM = ['#FFE699','#FFD878','#FFCA5A','#FFBF42','#FBB123','#F8A600','#F39C00','#EA8F00','#E58500','#DE7C00',
    '#D77200','#CF6900','#CB6200','#C35900','#BB5100','#B54C00','#B04500','#A63E00','#A13700','#9B3200',
    '#952D00','#8E2900','#882300','#821E00','#7B1A00','#771900','#701400','#6A0E00','#660D00','#5E0B00',
    '#5A0A02','#600903','#520907','#4C0505','#470606','#440607','#3F0708','#3B0607','#3A070B','#36080A'];
  function hex2rgb(h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
  function srmColor(v) {
    var x = Math.min(Math.max(v, 1), 40) - 1, lo = Math.floor(x), hi = Math.min(lo + 1, 39), t = x - lo;
    var a = hex2rgb(SRM[lo]), b = hex2rgb(SRM[hi]);
    return 'rgb(' + a.map(function (c, i) { return Math.round(c + (b[i] - c) * t); }).join(',') + ')';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function num(n, d) { return Number(n).toFixed(d).replace('.', ','); }
  function range(r, d) { return num(r[0], d) + ' – ' + num(r[1], d); }
  function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function catOf(id) { return DATA.categorie.filter(function (c) { return c.id === id; })[0]; }

  var state = { q: '', desc: false };

  function swatch(s) {
    return s.srm ? 'linear-gradient(' + srmColor(s.srm[0]) + ',' + srmColor(s.srm[1]) + ')' : 'var(--track)';
  }
  function card(s) {
    var nums = '';
    if (s.ibu) nums += '<span><b>IBU</b>' + range(s.ibu, 0) + '</span>';
    if (s.abv) nums += '<span><b>ABV</b>' + range(s.abv, 1) + '%</span>';
    if (s.srm) nums += '<span><b>SRM</b>' + range(s.srm, 1) + '</span>';
    return '<a class="card" href="#' + s.codice.toLowerCase() + '" style="--sw:' + swatch(s) + '">' +
      '<span class="swatch"></span><div class="body">' +
      '<div class="code">' + esc(s.codice) + '</div><h3>' + esc(s.nome) + '</h3>' +
      (nums ? '<div class="nums">' + nums + '</div>' : '') +
      '</div></a>';
  }

  function matches(s) {
    var q = norm(state.q).trim();
    if (!q) return true;
    var cat = catOf(s.categoria);
    var hay = [s.codice, s.nome, cat ? cat.nome : '', (s.esempi || []).join(' ')];
    if (state.desc) hay.push(s.breve, s.aroma, s.aspetto, s.sapore, s.corpo, s.commenti, s.storia, s.ingredienti, s.confronti, s.iscrizione);
    return norm(hay.join(' ')).indexOf(q) !== -1;
  }

  function listHTML() {
    var out = '', shown = 0;
    DATA.categorie.forEach(function (c) {
      var items = DATA.stili.filter(function (s) { return s.categoria === c.id && matches(s); });
      if (!items.length) return;
      shown += items.length;
      var isOpen = state.q.trim() ? true : !!(state.open && state.open[c.id]);
      out += '<details class="cat" data-id="' + c.id + '"' + (isOpen ? ' open' : '') + '><summary><h2><span>' + c.id + '</span>' + esc(c.nome) + '</h2><em>' + items.length + '</em></summary><p>' + esc(c.sintesi) + '</p>' +
        '<div class="list">' + items.map(card).join('') + '</div></details>';
    });
    if (!shown) out = '<p class="empty">Nessuno stile corrisponde a questa ricerca.</p>';
    return out;
  }

  function renderList(keepFocus) {
    var n = DATA.stili.length, pct = Math.round(n / DATA.totale * 100);
    var last = DATA.categorie[DATA.categorie.length - 1].id;
    app.innerHTML =
      '<header class="masthead"><h1>BJCP 2021 <em>· linee guida stili birrari</em></h1>' +
      '<div class="progress"><span>' + n + ' di ' + DATA.totale + ' stili inseriti</span><span class="bar"><i style="width:' + pct + '%"></i></span></div></header>' +
      '<div class="search"><input type="search" id="q" placeholder="Cerca uno stile, una categoria o un esempio" autocomplete="off" value="' + esc(state.q) + '">' +
      '<label for="desc"><input type="checkbox" id="desc"' + (state.desc ? ' checked' : '') + '> Cerca anche nelle descrizioni</label></div>' +
      '<div id="results">' + listHTML() + '</div>' +
      (n < DATA.totale ? '<div class="next">Prossima categoria da inserire: ' + (last + 1) + '.</div>' : '');
    var q = document.getElementById('q'), d = document.getElementById('desc'), r = document.getElementById('results');
    r.addEventListener('toggle', function (e) { var t = e.target; if (t.classList && t.classList.contains('cat') && !state.q.trim()) { state.open = state.open || {}; state.open[t.getAttribute('data-id')] = t.open; } }, true);
    q.addEventListener('input', function () { state.q = q.value; r.innerHTML = listHTML(); });
    d.addEventListener('change', function () { state.desc = d.checked; r.innerHTML = listHTML(); });
  }

  function prow(label, rng, d, min, max, unit, ticks) {
    var l = (rng[0] - min) / (max - min) * 100, w = (rng[1] - rng[0]) / (max - min) * 100;
    return '<div class="prow"><div class="top"><span>' + label + '</span><b>' + range(rng, d) + unit + '</b></div>' +
      '<div class="track"><i style="left:' + l.toFixed(2) + '%;width:' + w.toFixed(2) + '%"></i></div>' +
      '<div class="scale"><span>' + ticks[0] + '</span><span>' + ticks[1] + '</span></div></div>';
  }
  function paramsHTML(s) {
    var r = (s.og ? prow('OG', s.og, 3, 1.02, 1.13, '', ['1,020', '1,130']) : '') +
      (s.fg ? prow('FG', s.fg, 3, 0.995, 1.04, '', ['0,995', '1,040']) : '') +
      (s.ibu ? prow('IBU', s.ibu, 0, 0, 120, '', ['0', '120']) : '') +
      (s.srm ? prow('SRM', s.srm, 1, 0, 40, '', ['0', '40']) : '') +
      (s.abv ? prow('ABV', s.abv, 1, 0, 16, '%', ['0%', '16%']) : '');
    return r ? '<div class="params">' + r + '</div>' : '';
  }
  function sec(t, p) { return p ? '<div class="sec"><h2>' + t + '</h2><p>' + esc(p) + '</p></div>' : ''; }

  function renderDetail(s) {
    var c = catOf(s.categoria);
    app.innerHTML =
      '<a class="back" href="#">← Tutti gli stili</a>' +
      '<div class="hero"><div><div class="code">' + esc(s.codice) + '</div><h1>' + esc(s.nome) + '</h1>' +
      '<div class="catname">' + (c ? c.id + '. ' + esc(c.nome) : '') + '</div></div>' +
      (s.srm ? '<div><div class="glass" style="--c1:' + srmColor(s.srm[0]) + ';--c2:' + srmColor(s.srm[1]) + '"></div>' +
      '<div class="glass-cap">Colore: SRM ' + range(s.srm, 1) + '</div></div>' : '') + '</div>' +
      '<p class="lede">' + esc(s.breve) + '</p>' +
      sec('Aroma', s.aroma) + sec('Aspetto', s.aspetto) + sec('Sapore', s.sapore) + sec('Corpo e carbonazione', s.corpo) +
      sec('Commenti', s.commenti) + sec('Storia', s.storia) + sec('Ingredienti caratteristici', s.ingredienti) + sec('Confronti di stile', s.confronti) + sec('Istruzioni per l\'iscrizione', s.iscrizione) +
      paramsHTML(s) +
      (s.esempi && s.esempi.length ? '<div class="sec"><h2>Esempi commerciali</h2><div class="chips">' + (s.esempi || []).map(function (e) { var n = e.split('. ')[0].replace(/\.$/, '').trim(); return '<a class="ex" href="' + exHref(n) + '" target="_blank" rel="noopener">' + esc(n) + '</a>'; }).join('') + '</div></div>' : '') +
      '<p class="foot">Descrizioni riassunte a partire dalle Linee Guida Stili BJCP 2021 (traduzione italiana IBU). I parametri tecnici sono quelli ufficiali.</p>';
  }

  function route() {
    if (!DATA) return;
    var code = (location.hash || '').replace('#', '').toLowerCase();
    var s = DATA.stili.filter(function (x) { return x.codice.toLowerCase() === code; })[0];
    if (s) { renderDetail(s); window.scrollTo(0, 0); } else { renderList(); }
  }

  fetch('styles.json')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { DATA = d; route(); })
    .catch(function () { app.innerHTML = '<p class="empty">Non riesco a caricare i dati degli stili. Riapri la pagina tra un momento.</p>'; });
  window.addEventListener('hashchange', route);
})();
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
</html>
